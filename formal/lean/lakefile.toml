name = "PSystem"
version = "0.1.0"
defaultTargets = ["PSystem"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "PSystem"

# Driver for tests/test_lean_differential.py (not part of the proofs).
[[lean_exe]]
name = "derive_check"
root = "DeriveCheck"

# Driver for tests/test_quorum_differential.py (not part of the proofs).
[[lean_exe]]
name = "quorum_check"
root = "QuorumCheck"

# Driver for tests/test_epoch_differential.py (not part of the proofs).
[[lean_exe]]
name = "epoch_check"
root = "EpochCheck"
