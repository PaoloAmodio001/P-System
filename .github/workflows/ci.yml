# Minimal continuous integration: phase A of ROADMAP.md.
#
# What a green run says: the suite and the Lean proofs pass on Linux, on this commit. It says
# nothing that the tests and the proofs do not say themselves.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the Python dependencies
        run: python -m pip install -r requirements-dev.txt

      # Elan pinned; Lean toolchain version comes from formal/lean/lean-toolchain.
      - name: Install Lean
        env:
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.1/elan-x86_64-unknown-linux-gnu.tar.gz
          ELAN_ARCHIVE_SHA256: 4e717523217af592fa2d7b9c479410a31816c065d66ccbf0c2149337cfec0f5c
        run: |
          archive="$RUNNER_TEMP/elan.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors --retry-delay 15 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" --yes --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        working-directory: formal/lean
        run: lake build

      # lake build accepts sorry with a warning, and a theorem can rest on a new axiom.
      - name: Refuse shortcuts in the proofs
        working-directory: formal/lean
        run: |
          if grep -rnE '\b(sorry|admit|axiom|opaque|native_decide)\b' PSystem PSystem.lean; then
            echo "A forbidden keyword is in the proofs" >&2
            exit 1
          fi
          lake env lean AuditPSystem.lean > audit.log
          python ../../scripts/check_axioms.py audit.log

      # The tests that need Lean skip themselves without lake, and a run that skipped them
      # must not look like a run that passed them.
      - name: Run the complete suite, differentials and mutations included
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log
          if grep -E '[0-9]+ skipped' pytest.log; then
            echo "Tests were skipped" >&2
            exit 1
          fi

      # Logs, stores and threads of the nodes of a test that failed: see tests/failure_evidence.py.
      # Only what is in the folder, and that comes from the tests that use that file.
      - name: Keep what a failed test left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/
          if-no-files-found: ignore
          retention-days: 30
