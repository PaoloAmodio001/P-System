# Continuous integration: the proofs and the whole test suite.
#
# What a green run says: the suite and the Lean proofs pass on Linux, on this commit. It says
# nothing that the tests and the proofs do not say themselves.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache Lean toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
          key: ${{ runner.os }}-lean-toolchain-${{ hashFiles('formal/lean/lean-toolchain') }}

      # Install toolchain directly from releases.lean-lang.org (avoids elan/GitHub
      # release-asset 504s). Note: releases.lean-lang.org may redirect to GitHub.
      - name: Install Lean
        run: |
          set -euo pipefail
          tc="$(tr -d '\r\n' < formal/lean/lean-toolchain)"
          version="${tc#leanprover/lean4:}"          # e.g. v4.34.1
          ver="${version#v}"                         # e.g. 4.34.1
          name="${tc//\//--}"; name="${name//:/---}" # elan toolchain dir name
          dest="$HOME/.elan/toolchains/$name"
          if [ -x "$dest/bin/lake" ]; then
            echo "$dest/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          mkdir -p "$HOME/.elan/toolchains"
          archive="$RUNNER_TEMP/lean-toolchain.tar.zst"
          url="https://releases.lean-lang.org/lean4/${version}/lean-${ver}-linux.tar.zst"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors --retry-delay 15 --output "$archive" "$url"
          rm -rf "$dest" "$RUNNER_TEMP/lean-extract"
          mkdir -p "$RUNNER_TEMP/lean-extract"
          tar --use-compress-program=unzstd -xf "$archive" -C "$RUNNER_TEMP/lean-extract"
          extracted="$(find "$RUNNER_TEMP/lean-extract" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          if [ -z "$extracted" ] || [ ! -x "$extracted/bin/lake" ]; then
            echo "Lean toolchain extraction failed or unexpected layout" >&2
            find "$RUNNER_TEMP/lean-extract" -maxdepth 3 >&2 || true
            exit 1
          fi
          mv "$extracted" "$dest"
          echo "$dest/bin" >> "$GITHUB_PATH"

      - name: Build the proofs
        working-directory: formal/lean
        run: lake build

      # lake build accepts sorry with a warning, and a theorem can rest on a new axiom.
      - name: Refuse shortcuts in the proofs
        working-directory: formal/lean
        run: |
          if grep -rnE '\b(sorry|admit|axiom|opaque|native_decide)\b' PSystem PSystem.lean; then
            echo "A forbidden keyword is in the proofs" >&2
            exit 1
          fi
          lake env lean AuditPSystem.lean > audit.log
          python ../../scripts/check_axioms.py audit.log

      # The tests that need Lean skip themselves without lake, and a run that skipped them
      # must not look like a run that passed them.
      - name: Run the complete suite, differentials and mutations included
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log
          if grep -E '[0-9]+ skipped' pytest.log; then
            echo "Tests were skipped" >&2
            exit 1
          fi

      # Logs, stores and threads of the nodes of a test that failed: see tests/failure_evidence.py.
      # Only what is in the folder, and that comes from the tests that use that file.
      - name: Keep what a failed test left
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-failures/
          if-no-files-found: ignore
          retention-days: 30
